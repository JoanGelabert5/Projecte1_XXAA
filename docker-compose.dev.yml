services:
  web:
    build: .
    command: ["flask", "--app", "app:create_app", "run", "--host=0.0.0.0", "--port=5000", "--reload"]
    environment:
      APP_ENV: dev
      DB_HOST: db
      DB_NAME: ${DB_NAME:?Ejecuta ./run.sh init}
      DB_USER: ${DB_USER:?Ejecuta ./run.sh init}
      DB_PASSWORD: ${DB_PASSWORD:?Ejecuta ./run.sh init}
      CACHE_ENABLED: "false"
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:?Ejecuta ./run.sh init}:5000"
    volumes:
      - ./app:/app/app:ro
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/status', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Ejecuta ./run.sh init}
      POSTGRES_USER: ${POSTGRES_USER:?Ejecuta ./run.sh init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta ./run.sh init}
      DB_USER: ${DB_USER:?Ejecuta ./run.sh init}
      DB_PASSWORD: ${DB_PASSWORD:?Ejecuta ./run.sh init}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$DB_PASSWORD\" psql -h 127.0.0.1 -U \"$$DB_USER\" -d \"$$POSTGRES_DB\" -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM notes LIMIT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

networks:
  frontend:
  backend:
    internal: true
volumes:
  db_data:
